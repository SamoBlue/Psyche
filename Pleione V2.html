<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pleione | Abyssal Archive</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Figtree&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Figtree", sans-serif;
    }

    body {
      display: grid;
      place-content: center;
      min-height: 100vh;
      background-color: #000000;
      position: relative;
      overflow-x: hidden;
    }

    /* DARKER ATMOSPHERE — DEEPENED VOID */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(0,0,0,0.96), #010101 90%);
      pointer-events: none;
      z-index: -1;
    }

    /* SUBTLE STATIC / NOISE OVERLAY — UNEARTHLY */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.12"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: overlay;
    }

    /* GLITCH FLICKER OVERLAY (occult) */
    @keyframes sinisterFlicker {
      0% { opacity: 0; }
      10% { opacity: 0.03; background: rgba(80,0,0,0.2); }
      20% { opacity: 0; }
      100% { opacity: 0; }
    }
    .glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      background: rgba(30,0,0,0.08);
      mix-blend-mode: multiply;
      animation: sinisterFlicker 6s infinite;
    }

    audio {
      display: none;
    }

    .container {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 1em;
      width: 800px;
      height: 500px;
      transition: all 1000ms cubic-bezier(0.2, 0.9, 0.4, 1.1);
      z-index: 5;
      filter: drop-shadow(0 0 8px rgba(0,0,0,0.9));
    }

    .container:hover .box {
      filter: grayscale(100%) opacity(28%) brightness(0.5);
      cursor: pointer;
    }

    .box {
      position: relative;
      background: var(--img) center center;
      background-size: cover;
      transition: all 700ms cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      filter: grayscale(100%) brightness(0.6) contrast(1.2);
      border: 1px solid rgba(80, 0, 0, 0.2);
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* DARK BLOOD EDGE EFFECT ON HOVER */
    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, transparent 60%, rgba(40,0,0,0.6));
      pointer-events: none;
      z-index: 1;
      transition: 0.4s;
      opacity: 0;
    }

    .box:hover::before {
      opacity: 1;
    }

    .container .box:hover {
      filter: grayscale(0%) opacity(100%) brightness(1.2) contrast(1.1);
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(180, 0, 0, 0.7), inset 0 0 10px rgba(255,0,0,0.2);
      border-color: #a12222;
      transition: all 300ms ease;
    }

    /* RESIZE ANIMATIONS */
    .container:has(.box-1:hover) {
      grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr 1fr;
    }
    .container:has(.box-2:hover) {
      grid-template-columns: 1fr 3fr 1fr 1fr 1fr 1fr 1fr;
    }
    .container:has(.box-3:hover) {
      grid-template-columns: 1fr 1fr 3fr 1fr 1fr 1fr 1fr;
    }
    .container:has(.box-4:hover) {
      grid-template-columns: 1fr 1fr 1fr 3fr 1fr 1fr 1fr;
    }
    .container:has(.box-5:hover) {
      grid-template-columns: 1fr 1fr 1fr 1fr 3fr 1fr 1fr;
    }
    .container:has(.box-6:hover) {
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 3fr 1fr;
    }
    .container:has(.box-7:hover) {
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 3fr;
    }

    /* BOX 6 SPECIAL — GHOST GIF but more visceral */
    .container:has(.box-6:hover) .box-6 {
      background: url('https://i.postimg.cc/C1W9d9n5/Paused.gif') center center;
      background-size: cover;
      filter: brightness(1.3) contrast(1.4);
      transition: all 400ms;
    }

    /* WAVERING SHADOW FOR ODD/EVEN */
    .box:nth-child(odd) {
      transform: translateY(-18px);
    }
    .box:nth-child(even) {
      transform: translateY(18px);
    }

    /* HORROR LABELS — DISTORTED */
    .box::after {
      content: attr(data-text);
      position: absolute;
      bottom: 20px;
      background: #000000dd;
      backdrop-filter: blur(4px);
      color: #d4afaf;
      padding: 10px 16px 10px 20px;
      letter-spacing: 5px;
      text-transform: uppercase;
      transform: translateY(70px);
      opacity: 0;
      transition: all 600ms cubic-bezier(0.2, 1, 0.3, 1);
      font-weight: bold;
      font-size: 0.75rem;
      text-shadow: 0 0 3px #8b0000;
      border-left: 3px solid #b31f1f;
      z-index: 12;
      white-space: nowrap;
      font-family: monospace;
    }

    .box:hover::after {
      transform: translateY(0);
      opacity: 0.95;
      transition-delay: 350ms;
      letter-spacing: 6px;
      background: #110000ee;
      color: #ffbaba;
    }

    /* HAMBURGER MENU — TWISTED + SCARY */
    .hamburger {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 100;
      cursor: pointer;
      filter: drop-shadow(0 0 8px rgb(100,0,0));
    }

    .hamburger__container {
      position: relative;
      width: 54px;
      height: 54px;
      background: #110101cc;
      backdrop-filter: blur(8px);
      border-radius: 50%;
      border: 1px solid #a11a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .hamburger__inner, .hamburger__hidden {
      position: absolute;
      width: 28px;
      height: 2px;
      background-color: #bf3e3e;
      transition: 0.3s;
      box-shadow: 0 0 4px #ff0000;
    }
    .hamburger__inner::before, .hamburger__inner::after,
    .hamburger__hidden::before, .hamburger__hidden::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 2px;
      background-color: #bf3e3e;
      transition: 0.3s;
    }
    .hamburger__inner::before { transform: translateY(-9px); }
    .hamburger__inner::after { transform: translateY(9px); }
    .hamburger__hidden { opacity: 0; }

    .hamburger:hover .hamburger__container {
      background: #2a0303;
      border-color: #ff5555;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(220,0,0,0.5);
    }

    /* SCARY MODAL POPUP WHEN CLICK ON HAMBURGER */
    .scary-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.35s ease;
      font-family: monospace;
    }
    .scary-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: #0a0101e6;
      border: 2px solid #a12222;
      padding: 2rem 2rem;
      max-width: 380px;
      text-align: center;
      border-radius: 28px;
      box-shadow: 0 0 45px rgba(200,0,0,0.4);
      transform: scale(0.9);
      transition: 0.25s;
    }
    .scary-modal.active .modal-content {
      transform: scale(1);
    }
    .modal-content h3 {
      color: #e66;
      font-size: 2rem;
      letter-spacing: 6px;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .modal-content p {
      color: #bb9797;
      margin: 15px 0;
      line-height: 1.5;
    }
    .modal-close {
      background: #330000;
      border: none;
      padding: 8px 24px;
      margin-top: 20px;
      color: #ffaaaa;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
      transition: 0.2s;
    }
    .modal-close:hover {
      background: #8b0000;
      color: black;
      box-shadow: 0 0 12px red;
    }

    /* creepy cursor effect */
    body {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="27" viewBox="0 0 24 27"><polygon points="2,2 22,13 12,13 10,25" fill="%23880000" stroke="%23330000" stroke-width="1"/></svg>') 4 4, auto;
    }

    /* whisper scroll bar */
    ::-webkit-scrollbar {
      width: 5px;
      background: #0a0000;
    }
    ::-webkit-scrollbar-thumb {
      background: #6f1a1a;
      border-radius: 5px;
    }

    /* RANDOM RED FLICKER CLASS */
    .blood-flicker {
      animation: redFlash 0.08s 2;
    }
    @keyframes redFlash {
      0% { background: rgba(255,0,0,0.15); }
      100% { background: rgba(0,0,0,0); }
    }

    /* EXTRA DARK FOR BETTER HORROR */
    @keyframes pulseShadow {
      0% { filter: drop-shadow(0 0 2px maroon);}
      100% { filter: drop-shadow(0 0 12px darkred);}
    }
    .container {
      animation: pulseShadow 4s infinite alternate;
    }
  </style>
</head>
<body>

<div class="glitch-overlay"></div>
<div class="container">
  <div class="box box-1" style="--img: url(https://safebooru.org//images/4552/35247c7f12ee2ea3806f2d5793de360654bdd11e.png);" data-text="Celaeno" onclick="window.location.href='#';"></div>
  <div class="box box-2" style="--img: url(https://safebooru.org//images/4384/7daee74bb7bf66aec87eddadd990998f9cc64e28.jpg);" data-text="Heaven"></div>
  <div class="box box-3" style="--img: url(https://safebooru.org//images/4469/b48af8cca3e969ede983b1697a7673db8f4aa0ac.jpg);" data-text="Natsuki"></div>
  <div class="box box-4" style="--img: url(https://safebooru.org//images/3197/6116fca199f2f0b7057fef9f9e155eec79bdc165.png);" data-text="Ephesus"></div>
  <div class="box box-5" style="--img: url(https://metroom.files.wordpress.com/2023/09/99663712_p0_master1200.jpg);" data-text="superbia"></div>
  <div class="box box-6" style="--img: url(https://i.postimg.cc/C1W9d9n5/Paused.gif);" data-text="Sieben"></div>
  <div class="box box-7" style="--img: url(https://safebooru.org//images/2315/30d8b4ed04943267627404043f1fd7adacbad9de.jpg);" data-text="Choi Yu-ju"></div>
</div>

<div class="hamburger">
  <div class="hamburger__container">
    <div class="hamburger__inner"></div>
    <div class="hamburger__hidden"></div>
  </div>
</div>

<!-- SCARY MODAL (hidden by default) -->
<div id="scaryModal" class="scary-modal">
  <div class="modal-content">
    <h3>◈ ABYSS ◈</h3>
    <p>You should not have opened this.<br> Something watches you through the frames.</p>
    <p style="font-size: 0.8rem; color:#a33;">"the seventh box whispers your name"</p>
    <button class="modal-close">⟡ RETURN SILENCE ⟡</button>
  </div>
</div>

<audio autoplay loop id="bgAudio">
  <source src="perfect.mp3" type="audio/mp3">
  Your browser does not support the audio element.
</audio>

<script>
  (function() {
    // volume control (darker ambiance lower volume)
    const audio = document.getElementById('bgAudio');
    if(audio) {
      audio.volume = 0.02;   // eerie low volume
      // attempt to handle autoplay restrictions: if autoplay fails, we add a hidden unlocker
      audio.play().catch(e => {
        console.log("Autoplay blocked - user interaction needed.");
        document.body.addEventListener('click', function initAudio() {
          audio.play();
          document.body.removeEventListener('click', initAudio);
        }, { once: true });
      });
    }

    // HAMBURGER MENU: open scary modal with dreadful animations and scream-like effect
    const hamburger = document.querySelector('.hamburger');
    const modal = document.getElementById('scaryModal');
    const closeBtn = document.querySelector('.modal-close');

    if(hamburger) {
      hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        if(modal) {
          modal.classList.add('active');
          // add body jitter effect
          document.body.classList.add('blood-flicker');
          setTimeout(() => document.body.classList.remove('blood-flicker'), 200);
          // slight additional scary audio glitch : create a tiny beep?
          const glitchSound = new Audio();
          // no actual file, just a conceptual shift: but we create a tiny oscillator? no but we add visual horror
          const horrorFlash = document.createElement('div');
          horrorFlash.style.position = 'fixed';
          horrorFlash.style.top = 0; horrorFlash.style.left = 0;
          horrorFlash.style.width = '100%'; horrorFlash.style.height = '100%';
          horrorFlash.style.background = 'radial-gradient(circle, #aa000022, transparent)';
          horrorFlash.style.pointerEvents = 'none';
          horrorFlash.style.zIndex = '999';
          document.body.appendChild(horrorFlash);
          setTimeout(() => horrorFlash.remove(), 300);
        }
      });
    }

    if(closeBtn) {
      closeBtn.addEventListener('click', () => {
        modal.classList.remove('active');
      });
    }
    // close modal clicking outside content
    if(modal) {
      modal.addEventListener('click', (e) => {
        if(e.target === modal) {
          modal.classList.remove('active');
        }
      });
    }

    // 1) Random glitch effect on boxes, occasional red flicker
    const boxes = document.querySelectorAll('.box');
    setInterval(() => {
      if (Math.random() < 0.07) {
        const randomBox = boxes[Math.floor(Math.random() * boxes.length)];
        if(randomBox) {
          randomBox.style.filter = 'grayscale(0%) brightness(1.6) contrast(1.5)';
          randomBox.style.transition = '0.05s';
          setTimeout(() => {
            if(randomBox) randomBox.style.filter = '';
          }, 100);
          // also add a text ghost flicker
          const originalLabel = randomBox.getAttribute('data-text');
          if(originalLabel && Math.random() > 0.5) {
            randomBox.setAttribute('data-text', originalLabel.split('').map(c => Math.random() > 0.7 ? '#' : c).join(''));
            setTimeout(() => randomBox.setAttribute('data-text', originalLabel), 400);
          }
        }
      }
    }, 3200);

    // 2) extra horror: mouse trail? not needed, but we add distortion to the container when clicking any box
    boxes.forEach(box => {
      box.addEventListener('click', (e) => {
        // avoid weirdness on box6 gif but keep effect
        e.stopPropagation();
        const oldText = box.getAttribute('data-text');
        box.style.transform = 'translateY(2px) scale(0.98)';
        setTimeout(() => { box.style.transform = ''; }, 150);
        // small whisper console
        console.log(`%c[ Pleione ] %c${oldText || 'unknown'} stirs in the dark`, "color: #6a1a1a", "color:#b33");
        // optional jump scare reflection
        const tempDiv = document.createElement('div');
        tempDiv.style.position = 'fixed';
        tempDiv.style.bottom = '10px';
        tempDiv.style.right = '10px';
        tempDiv.style.color = '#6a0000';
        tempDiv.style.fontSize = '12px';
        tempDiv.style.fontFamily = 'monospace';
        tempDiv.innerText = '⟡ you flinched ⟡';
        tempDiv.style.zIndex = '1000';
        tempDiv.style.background = '#000000aa';
        tempDiv.style.padding = '4px 8px';
        document.body.appendChild(tempDiv);
        setTimeout(() => tempDiv.remove(), 800);
      });
    });

    // 3) deep dark animated background shift – more sinister
    let hue = 0;
    setInterval(() => {
      if (Math.random() < 0.03) {
        document.body.style.transition = 'background 3s';
        document.body.style.backgroundColor = '#020000';
        setTimeout(() => { document.body.style.backgroundColor = ''; }, 800);
      }
    }, 5000);

    // 4) add extra gore details on hover: faint heartbeat?
    const container = document.querySelector('.container');
    let heartRate = false;
    const addPulseClass = () => {
      container.style.animation = 'none';
      container.offsetHeight;
      container.style.animation = 'pulseShadow 4s infinite alternate';
    };
    setInterval(addPulseClass, 8000);

    // 5) create a "whisper" effect that appears randomly floating text
    const whispers = [
      "let me out", "you're next", "don't touch box 6", "blood memory", "the seventh stares",
      "celaeno hungers", "superbia feeds", "ephesus decays"
    ];
    setInterval(() => {
      if(Math.random() < 0.12) {
        const whisperDiv = document.createElement('div');
        whisperDiv.innerText = whispers[Math.floor(Math.random() * whispers.length)];
        whisperDiv.style.position = 'fixed';
        whisperDiv.style.bottom = `${Math.random() * 80 + 10}%`;
        whisperDiv.style.left = `${Math.random() * 80 + 10}%`;
        whisperDiv.style.color = `rgba(180, 60, 60, ${Math.random() * 0.5 + 0.2})`;
        whisperDiv.style.fontFamily = 'monospace';
        whisperDiv.style.fontSize = `${Math.random() * 14 + 10}px`;
        whisperDiv.style.zIndex = '200';
        whisperDiv.style.pointerEvents = 'none';
        whisperDiv.style.textShadow = '0 0 5px black';
        whisperDiv.style.opacity = '0.8';
        whisperDiv.style.whiteSpace = 'nowrap';
        document.body.appendChild(whisperDiv);
        setTimeout(() => {
          whisperDiv.style.transition = 'opacity 2s';
          whisperDiv.style.opacity = '0';
          setTimeout(() => whisperDiv.remove(), 2000);
        }, 1800);
      }
    }, 5000);

    // 6) extra horror: cursor distortion / blood drip when hovering over boxes (visual)
    const style = document.createElement('style');
    style.textContent = `
      .box {
        transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
        cursor: crosshair;
      }
      .box:active {
        transform: scale(0.97);
        filter: brightness(1.5) grayscale(20%);
      }
      .hamburger__container {
        transition: all 0.3s;
      }
      .scary-modal.active .modal-content {
        border-image: repeating-linear-gradient(45deg, #a12222, #2a0000 10px) 1;
      }
    `;
    document.head.appendChild(style);
    
    // 7) Make background darker and add a very faint red vignette
    const vignette = document.createElement('div');
    vignette.style.position = 'fixed';
    vignette.style.top = 0;
    vignette.style.left = 0;
    vignette.style.width = '100%';
    vignette.style.height = '100%';
    vignette.style.pointerEvents = 'none';
    vignette.style.boxShadow = 'inset 0 0 120px 30px rgba(0,0,0,0.85), inset 0 0 30px 8px rgba(80,0,0,0.3)';
    vignette.style.zIndex = '10';
    document.body.appendChild(vignette);
    
    // also overlay tiny scanlines
    const scanlines = document.createElement('div');
    scanlines.style.position = 'fixed';
    scanlines.style.top = 0;
    scanlines.style.left = 0;
    scanlines.style.width = '100%';
    scanlines.style.height = '100%';
    scanlines.style.background = 'repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px)';
    scanlines.style.pointerEvents = 'none';
    scanlines.style.zIndex = '12';
    document.body.appendChild(scanlines);
    
    // 8) optional: Randomly trigger blood-drip effect on container hover
    let dripTimeout;
    container.addEventListener('mouseenter', () => {
      if(Math.random() < 0.25) {
        const drip = document.createElement('div');
        drip.innerHTML = '⬤';
        drip.style.position = 'fixed';
        drip.style.top = '0px';
        drip.style.left = `${Math.random() * 100}%`;
        drip.style.color = '#b30000';
        drip.style.fontSize = '14px';
        drip.style.opacity = '0.8';
        drip.style.pointerEvents = 'none';
        drip.style.zIndex = '999';
        document.body.appendChild(drip);
        let pos = 0;
        const fall = setInterval(() => {
          pos += 8;
          drip.style.top = pos + 'px';
          if (pos > window.innerHeight) {
            clearInterval(fall);
            drip.remove();
          }
        }, 30);
        setTimeout(() => { if(drip) drip.remove(); clearInterval(fall); }, 2500);
      }
    });
    
    // 9) Prevent default on empty links (box-1 onclick was '#')
    const firstBox = document.querySelector('.box-1');
    if(firstBox) {
      firstBox.addEventListener('click', (e) => {
        e.preventDefault();
        // create whisper
        const whisp = document.createElement('div');
        whisp.innerText = '❌ access denied ❌';
        whisp.style.position = 'fixed';
        whisp.style.bottom = '50%';
        whisp.style.left = '45%';
        whisp.style.background = 'black';
        whisp.style.color = 'red';
        whisp.style.padding = '6px 12px';
        whisp.style.zIndex = '300';
        whisp.style.fontFamily = 'monospace';
        document.body.appendChild(whisp);
        setTimeout(() => whisp.remove(), 1000);
      });
    }
    
    // final: make sure background remains pitch black & boxes more dark. done.
    console.log("%c⚠ PLEIONE ARCHIVE — THE VOID LISTENS ⚠", "color:#8b0000; font-size:14px");
  })();
</script>
</body>
</html>
